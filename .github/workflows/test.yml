name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# A newer push supersedes the runs of the older one: cancel them instead of
# queueing, so iterating quickly never waits on stale results.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check if PR should run tests (skip for external PRs without issue reference)
  should-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            // Always run for push events
            if (context.eventName === 'push') {
              core.setOutput('run', 'true');
              return;
            }

            const pr = context.payload.pull_request;
            const author = pr.user.login;

            // Check if author has write access
            try {
              const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: author
              });
              if (['admin', 'write'].includes(perm.permission)) {
                core.setOutput('run', 'true');
                console.log(`Author ${author} has ${perm.permission} access`);
                return;
              }
            } catch (e) {
              // Not a collaborator
            }

            // Check for issue reference
            const body = pr.body || '';
            const issuePattern = /(close[sd]?|fix(e[sd])?|resolve[sd]?)\s*#(\d+)|#(\d+)/gi;
            if (body.match(issuePattern)) {
              core.setOutput('run', 'true');
              console.log('PR has issue reference');
              return;
            }

            console.log('Skipping tests - external PR without issue reference');
            core.setOutput('run', 'false');

  test:
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    # Every job gets a timeout: a leaked daemon fd once held the coverage job
    # for the full 6h default, burning the runner for nothing.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # The two macOS passes (Homebrew bash 5.x and system bash 3.2) used to
      # run back-to-back in one job, making it the wall-clock long pole; as
      # separate matrix entries they run side by side.
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos-bash5
          - os: macos-latest
            name: macos-bash32
    name: test (${{ matrix.name }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y bats jq
          else
            command -v bats >/dev/null 2>&1 || brew install bats-core
            command -v jq >/dev/null 2>&1 || brew install jq
          fi

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Make pwt executable
        run: chmod +x bin/pwt

      # scripts/test.sh parallelizes across .bats files (test files are
      # sandboxed; ports were the one shared resource, randomized per file
      # since 2026-08-05).
      - name: Run tests
        if: matrix.name != 'macos-bash32'
        run: make test

      # macOS ships bash 3.2.57, where BATS silently swallows a failing [[ ]]
      # unless it is the test's last command. The pass above uses whichever
      # bash `env bash` finds (Homebrew's 5.x on GitHub runners), so this
      # entry is what actually exercises the 3.2 target users get.
      - name: Run tests under macOS system bash 3.2
        if: matrix.name == 'macos-bash32'
        run: scripts/test.sh
        env:
          PWT_TEST_BASH: /bin/bash

  # Runs the whole suite with `set -u` forced on, which mechanically enforces
  # the CLAUDE.md rule that every PWT_* variable must be exported with a
  # default: a missing one becomes an unbound-variable failure instead of
  # needing a hand-written test per variable. Pattern from bats-core.
  test-nounset:
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Run suite under set -u
        run: |
          chmod +x bin/pwt
          scripts/test.sh
        env:
          BASH_ENV: ${{ github.workspace }}/.github/workflows/set_nounset.bash

  # Minimal Linux box: no jq, no lsof, no column, no curl. pwt must still
  # start, degrade gracefully and pass everything that does not need those
  # tools. Guards the "core is bash + git + coreutils" promise.
  test-minimal:
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: debian:12-slim
    steps:
      - name: Install the bare minimum
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bash git ca-certificates procps
          git config --global --add safe.directory '*'
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Smoke test without optional tools
        run: |
          chmod +x bin/pwt
          ./bin/pwt --version
          ./bin/pwt help >/dev/null
          ./bin/pwt doctor || true   # must degrade to warnings, never crash

          # A fresh install has nothing to convert and must not demand jq
          ./bin/pwt state migrate --status
          ./bin/pwt state migrate
          test "$(cat "${PWT_DIR:-$HOME/.pwt}/state-version")" = "2"

          # `command -v` returns 1 for an absent tool - which is the expected
          # state here - so the loop must not decide the step's exit status.
          for tool in jq lsof column curl fzf; do
            if command -v "$tool" >/dev/null; then
              echo "WARNING: $tool unexpectedly present"
            fi
          done
          true

      # The full suite is NOT run here on purpose: ~30 of its assertions pipe
      # output through jq, so they fail for lack of a test-side tool rather
      # than a product defect. This job guards the product promise (pwt runs
      # and degrades cleanly with only bash+git+coreutils); the ubuntu job
      # covers the suite.

  # Line coverage moved to its own weekly workflow (coverage.yml): the kcov
  # run is ~15x the plain suite, which will never fit the fast per-push loop.

  shellcheck:
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      # Errors are blocking (baseline 2026-08-08: zero across bin/ and lib/).
      - name: Run ShellCheck (errors block)
        run: shellcheck -x -S error bin/pwt lib/pwt/*.sh

      # Warnings are informational until the SC2155 backlog is worked down.
      - name: Run ShellCheck (warnings, informational)
        run: shellcheck -x -S warning bin/pwt lib/pwt/*.sh || true

      # Pinned static binary: apt's shfmt is older and formats differently,
      # which would make CI disagree with the local baseline (brew 3.13.x),
      # and `go install` spent ~40s compiling what a download gets in ~2s.
      - name: Install shfmt
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/shfmt" \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          chmod +x "$HOME/.local/bin/shfmt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # A gate since the 2026-08-09 reformat: the backlog is zero, so any
      # drift is new and cheap to fix. Same file list as scripts/check.
      # No printer flags: .editorconfig is the single source of formatting truth.
      - name: Check formatting (shfmt, blocking)
        run: |
          unformatted=$(shfmt -l bin/pwt lib/pwt/*.sh completions/pwt.bash)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files (run 'shfmt -w .'):"
            printf '  %s\n' $unformatted
            exit 1
          fi
