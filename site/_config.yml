title: pwt — Power Worktrees
description: A powerful Git worktree workflow for today's multi-project development.
url: "https://jonasporto.github.io"
baseurl: "/pwt"
lang: en
author:
  name: Jonas Porto
  url: https://github.com/jonasporto

twitter:
  username: jonasporto
  card: summary_large_image

# GA4 measurement ID (public by design; ships in every visitor's HTML).
# The snippet only renders in production builds, so local previews stay clean.
google_analytics: "G-N7V6Z9Q9GP"

markdown: kramdown
permalink: /blog/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: blog/feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
