<!-- Icone do pwt, derivado da propria arte do site (assets/covers/card-home.png):
     fundo quente #fcf9f6, prompt $ no azul de acento #0969da, IBM Plex Mono 700.
     A fonte vai EMBUTIDA: sem ela o glifo cairia numa mono do sistema e o $
     mudaria de desenho conforme a maquina que gera o icone.
     Sem cantos proprios aqui? Nao: favicon nao e enquadrado por ninguem, entao
     o arredondado vem no arquivo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs><style>
    @font-face{font-family:"PlexMono";src:url(data:font/woff2;base64,) format("woff2");font-weight:700}
  </style></defs>
  <rect width="128" height="128" rx="26" fill="#fcf9f6"/>
  <g id="ink" transform="translate(0,1.95)">
    <text x="64" y="92" font-family="PlexMono, ui-monospace, monospace" font-size="86"
          font-weight="700" fill="#0969da" text-anchor="middle">$</text>
  </g>
</svg>