<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
<!-- Icones gerados de assets/icon.svg pelo web-kit (make-icons + make-ico), nao
     desenhados a mao: um .png reexportado a mao envelhece em silencio.
     SVG primeiro para quem suporta, PNG como fallback: o Google Search NAO
     renderiza favicon SVG, entao sem o PNG o icone some dos resultados. -->
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" href="{{ '/assets/icon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="96x96" href="{{ '/favicon-96.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="48x48" href="{{ '/favicon-48.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
<meta name="theme-color" content="#fcf9f6">
<!-- jekyll-seo-tag nao emite og:image:alt; sem ele o card fica sem texto
     alternativo para quem usa leitor de tela. -->
<meta property="og:image:alt" content="pwt, Power Worktrees: one branch per worktree, one port per server.">
<meta name="twitter:image:alt" content="pwt, Power Worktrees: one branch per worktree, one port per server.">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
<link rel="preload" href="{{ '/assets/fonts/plex-mono-700.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="pwt blog" href="{{ '/blog/feed.xml' | relative_url }}">
{% if jekyll.environment == "production" and site.google_analytics != "" %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics }}');
</script>
{% endif %}
</head>
<body>
<nav class="top">
  <a class="brand" href="{{ '/' | relative_url }}">pwt</a>
  <a href="{{ '/docs/' | relative_url }}">Docs</a>
  <a href="{{ '/blog/' | relative_url }}">Blog</a>
  <span class="spacer"></span>
  <a href="https://github.com/jonasporto/pwt">GitHub</a>
</nav>
<main>
{{ content }}
</main>
<footer>
  MIT © Jonas Porto · <a href="https://github.com/jonasporto/pwt">github.com/jonasporto/pwt</a> · <a href="{{ '/blog/feed.xml' | relative_url }}">RSS</a>
</footer>
<script>
  // Hover anchor on every heading that has an id: docs pages set theirs
  // explicitly, kramdown derives the rest.
  document.querySelectorAll('main h2[id], main h3[id], main h4[id]').forEach(function (h) {
    var a = document.createElement('a');
    a.className = 'docs-anchor';
    a.href = '#' + h.id;
    a.textContent = '#';
    a.setAttribute('aria-label', 'Link to this section');
    h.appendChild(a);
  });
  document.querySelectorAll('div.highlighter-rouge, .term').forEach(function (block) {
    var pre = block.querySelector('pre'); if (!pre) return;
    var btn = document.createElement('button');
    btn.className = 'copy-btn'; btn.type = 'button'; btn.textContent = 'copy';
    btn.addEventListener('click', function () {
      navigator.clipboard.writeText(pre.innerText).then(function () {
        btn.textContent = 'copied'; setTimeout(function () { btn.textContent = 'copy'; }, 1500);
      });
    });
    block.style.position = 'relative';
    block.appendChild(btn);
  });
</script>
</body>
</html>
