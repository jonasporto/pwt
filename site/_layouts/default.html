<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · pwt{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="pwt blog" href="{{ '/blog/feed.xml' | relative_url }}">
</head>
<body>
<nav class="top">
  <a class="brand" href="{{ '/' | relative_url }}">pwt</a>
  <a href="{{ '/blog/' | relative_url }}">Blog</a>
  <span class="spacer"></span>
  <a href="https://github.com/jonasporto/pwt">GitHub</a>
</nav>
<main>
{{ content }}
</main>
<footer>
  MIT © Jonas Porto · <a href="https://github.com/jonasporto/pwt">github.com/jonasporto/pwt</a> · <a href="{{ '/blog/feed.xml' | relative_url }}">RSS</a>
</footer>
</body>
</html>
